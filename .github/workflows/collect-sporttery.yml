name: Collect sporttery data

# 通过腾讯云开发上的 jc-collector 云函数（国内出口）采集竞彩数据。
# GitHub 服务器直连体彩接口会被拦截（HTTP 567），所以这里只调用云函数。
on:
  schedule:
    - cron: "47 4 * * *"   # 北京时间 12:47 兜底：主力是腾讯云 jc-daily（10:17/12:17），当天已有推荐就跳过
  workflow_run:
    workflows: ["Deploy CloudBase functions"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tasks:
        description: "任务，空格分隔：calc / results:开始:结束 / results-range:开始:结束 / history:id1,id2 / history-pending:场数 / history-file:名单文件"
        default: "calc"

permissions:
  contents: write

concurrency:
  group: collect-sporttery
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TCB_DISABLE_REPORT: "1"
      CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip if today's picks already exist (backup schedule only)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -f "recommendations/$(TZ=Asia/Shanghai date +%F).md" ]; then
            echo "今天的推荐已由腾讯云 jc-daily 生成，兜底跳过"; echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v5
        if: ${{ env.SKIP != '1' }}
        with:
          node-version: "20"

      - name: Install CloudBase CLI and log in
        if: ${{ env.SKIP != '1' }}
        run: |
          npm install --global @cloudbase/cli@3.8.3
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID" --yes

      - name: Collect
        if: ${{ env.SKIP != '1' }}
        env:
          INPUT_TASKS: ${{ github.event.inputs.tasks }}
        run: |
          YESTERDAY=$(TZ=Asia/Shanghai date -d "yesterday" +%F)
          TASKS="${INPUT_TASKS:-calc results:$YESTERDAY:$YESTERDAY}"
          echo "tasks: $TASKS"
          node scripts/collect.mjs "$RUNNER_TEMP/raw" $TASKS

      - name: Store (commit to repository)
        if: always()
        run: |
          # 2026-10-31 用户明确决定：仓库公开期间也直接提交原始数据。
          test -d "$RUNNER_TEMP/raw" || { echo "nothing collected"; exit 0; }
          mkdir -p data/raw/sporttery
          cp -rn "$RUNNER_TEMP/raw/." data/raw/sporttery/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/sporttery
          git diff --cached --quiet || git commit -m "data: sporttery raw $(TZ=Asia/Shanghai date +%F_%H%M)"
          git pull --rebase -q && git push
