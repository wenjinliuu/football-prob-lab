name: Collect sporttery data

# 通过腾讯云开发上的 jc-collector 云函数（国内出口）采集竞彩数据。
# GitHub 服务器直连体彩接口会被拦截（HTTP 567），所以这里只调用云函数。
on:
  schedule:
    - cron: "17 2 * * *"   # 北京时间 10:17：当日在售赔率 + 前一天赛果
  workflow_run:
    workflows: ["Deploy CloudBase functions"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tasks:
        description: "任务，空格分隔：calc / results:开始:结束 / history:id1,id2"
        default: "calc"

permissions:
  contents: write

concurrency:
  group: collect-sporttery
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TCB_DISABLE_REPORT: "1"
      CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install CloudBase CLI and log in
        run: |
          npm install --global @cloudbase/cli@3.8.3
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID" --yes

      - name: Collect
        env:
          INPUT_TASKS: ${{ github.event.inputs.tasks }}
        run: |
          YESTERDAY=$(TZ=Asia/Shanghai date -d "yesterday" +%F)
          TASKS="${INPUT_TASKS:-calc results:$YESTERDAY:$YESTERDAY}"
          echo "tasks: $TASKS"
          node scripts/collect.mjs "$RUNNER_TEMP/raw" $TASKS

      - name: Store (commit only when the repository is private)
        if: always()
        run: |
          PRIVATE=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          test -d "$RUNNER_TEMP/raw" || { echo "nothing collected"; exit 0; }
          if [ "$PRIVATE" = "true" ]; then
            mkdir -p data/raw/sporttery
            cp -rn "$RUNNER_TEMP/raw/." data/raw/sporttery/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/sporttery
            git diff --cached --quiet || git commit -m "data: sporttery raw $(TZ=Asia/Shanghai date +%F_%H%M)"
            git pull --rebase -q && git push
          else
            echo "::warning::仓库是公开的：体彩数据不提交到仓库（避免公开转载），只作为 Actions 附件保存 90 天。改成 Private 后会自动改为提交存档，并可运行 Import sporttery artifacts 把附件补进仓库。"
            echo "SAVE_ARTIFACT=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SAVE_ARTIFACT == '1' }}
        with:
          name: sporttery-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/raw
          retention-days: 90
