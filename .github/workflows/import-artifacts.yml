name: Import sporttery artifacts

# 把 Actions 附件里的采集结果补存进仓库（只新增不覆盖）。手动运行。
# 也用于电子衣橱服务器（线 2）的回补结果：repo=wenjinliuu/ai-wardrobe-lab, prefix=sporttery-history-lighthouse-, dest=data/raw/sporttery/history。
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "附件所在仓库"
        default: "wenjinliuu/football-prob-lab"
      prefix:
        description: "附件名前缀"
        default: "sporttery-raw-"
      dest:
        description: "解压到哪个目录"
        default: "data/raw/sporttery"

permissions:
  contents: write
  actions: read

concurrency:
  group: import-artifacts
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_REPO: ${{ github.event.inputs.repo || 'wenjinliuu/football-prob-lab' }}
      PREFIX: ${{ github.event.inputs.prefix || 'sporttery-raw-' }}
      DEST: ${{ github.event.inputs.dest || 'data/raw/sporttery' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/zips" "$RUNNER_TEMP/raw"
          [[ "$SRC_REPO" =~ ^wenjinliuu/[A-Za-z0-9._-]+$ && "$DEST" =~ ^data/raw/[a-z_/]+$ && "$PREFIX" =~ ^[a-z0-9-]+$ ]]
          gh api --paginate "repos/$SRC_REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and (.name | startswith(\"$PREFIX\"))) | \"\(.id) \(.name)\"" \
            > "$RUNNER_TEMP/list.txt"
          echo "artifacts: $(wc -l < "$RUNNER_TEMP/list.txt")"
          while read -r ID NAME; do
            gh api "repos/$SRC_REPO/actions/artifacts/$ID/zip" > "$RUNNER_TEMP/zips/$NAME.zip"
            unzip -n -q "$RUNNER_TEMP/zips/$NAME.zip" -d "$RUNNER_TEMP/raw"
          done < "$RUNNER_TEMP/list.txt"

      - name: Commit
        run: |
          mkdir -p "$DEST"
          cp -rn "$RUNNER_TEMP/raw/." "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "data: import $PREFIX artifacts from $SRC_REPO"
          git pull --rebase -q && git push
