name: Analysis reports

# 用仓库里的原始数据重新生成 reports/。采集成功后自动跑，也可手动触发。
on:
  workflow_run:
    workflows: ["Collect sporttery data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: true

jobs:
  report:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/external
          key: external-${{ github.run_id }}
          restore-keys: external-
      - run: python analysis/step1_market.py
      - run: python analysis/step2_pinnacle.py
      - run: python analysis/step3_history.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/mappings
          git diff --cached --quiet || git commit -m "reports: regenerate analysis reports"
          # 报告类文件每次整体重算：rebase 冲突时以本次生成的版本为准（-X theirs 在 rebase 中指本地提交）
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs -q && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "::error::推送失败"; exit 1
