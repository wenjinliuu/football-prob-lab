name: Analysis reports

# 用仓库里的原始数据重新生成 reports/。采集成功后自动跑，也可手动触发。
on:
  workflow_run:
    workflows: ["Collect sporttery data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: true

jobs:
  report:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python analysis/step1_market.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "reports: regenerate step1 market report"
          git pull --rebase -q && git push
